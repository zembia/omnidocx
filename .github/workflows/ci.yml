name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4", "4.0"]
        rubyzip: ["1", "2", "3"]
    name: Ruby ${{ matrix.ruby }}, rubyzip ${{ matrix.rubyzip }}.x
    env:
      BUNDLE_GEMFILE: gemfiles/rubyzip_${{ matrix.rubyzip }}.gemfile
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec --tag '~render'

  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rubyzip: ["1", "2", "3"]
    name: Render with LibreOffice, rubyzip ${{ matrix.rubyzip }}.x
    env:
      BUNDLE_GEMFILE: gemfiles/rubyzip_${{ matrix.rubyzip }}.gemfile
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rspec --tag render
